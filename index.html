<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch Marble Racer</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.165.0",
            "three/addons/": "https://esm.sh/three@0.165.0/examples/jsm/",
            "cannon-es": "https://esm.sh/cannon-es@0.20.0",
            "tmi.js": "https://esm.sh/tmi.js@1.8.5"
        }
    }
    </script>
</head>
<body>
    <div id="ui-container">
        <div id="connection-panel">
            <h1>Twitch Marble Racer</h1>
            <div class="input-group">
                <label for="channel-name">Twitch Channel:</label>
                <input type="text" id="channel-name" placeholder="Enter channel name...">
                <button id="connect-btn">Connect</button>
            </div>
            <p id="connection-status">Status: Disconnected</p>
        </div>

        <div id="race-controls" class="hidden">
            <button id="start-race-btn">Start Race</button>
            <button id="reset-race-btn">Reset</button>
            <div id="timer">Race starts in: 15s</div>
        </div>

        <div id="player-list-container">
            <h2>Players Joined (<span id="player-count">0</span>)</h2>
            <ul id="player-list"></ul>
        </div>
        
        <div id="leaderboard" class="hidden">
            <h2>Leaderboard</h2>
            <ol id="leaderboard-list"></ol>
        </div>
    </div>
    <div id="tooltip">
        <strong id="tooltip-title"></strong>
        <pre id="tooltip-content"></pre>
    </div>
    <canvas id="game-canvas"></canvas>
    <script type="module" src="main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
